<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso · Isys Mattos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FFFFFF;--ink:#37352F;--ink-2:#6A6862;--ink-3:#9A968E;
    --hair:#DCD9D2;--hair-soft:#ECE9E3;--red:#AA564A;--green:#5E7D57;--gold:#AF853A;
    --display:"Quicksand",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;
    -webkit-font-smoothing:antialiased;display:grid;grid-template-columns:37% 63%}
  @media(max-width:820px){body{grid-template-columns:1fr}}

  /* lado grafite */
  .mark{background:var(--ink);color:#fff;position:relative;display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,5vw,64px)}
  @media(max-width:820px){.mark{min-height:200px;justify-content:flex-end}}
  .mark .wm{font-family:var(--sans);font-weight:400;font-size:clamp(30px,3.4vw,40px);letter-spacing:.14em;line-height:1;white-space:nowrap}
  /* em janelas médias o nome não pode quebrar em duas linhas (o subtítulo acompanha a largura dele) */
  @media(min-width:821px){.mark{padding-left:clamp(28px,4vw,64px);padding-right:clamp(28px,4vw,64px)} .mark .wm{font-size:clamp(28px,3.4vw,40px)}}
  .mark .tg{font-family:var(--sans);font-weight:300;font-size:13px;letter-spacing:.34em;color:#9a9895;margin-top:12px;text-transform:lowercase}

  /* lado formulário */
  .panel{display:flex;align-items:center;justify-content:center;padding:clamp(28px,5vw,72px)}
  .box{width:100%;max-width:392px}
  .sec-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 22px}
  .sec-label::before{content:"| ";color:var(--gold)}
  @keyframes loginrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .box{animation:loginrise .5s cubic-bezier(.22,.61,.36,1) both}
  @media(prefers-reduced-motion:reduce){.box{animation:none}}

  /* toggle cliente | colaborador */
  .roles{display:flex;align-items:center;gap:14px;margin-bottom:30px}
  .role{font-family:var(--sans);font-weight:400;font-size:15px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:2px 0 6px;position:relative;transition:color .2s}
  .role[aria-selected="true"]{color:var(--ink)}
  .role[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--gold)}
  .role-sep{color:var(--hair);font-weight:300}

  .field{display:flex;flex-direction:column;margin-bottom:22px}
  .field label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  .field input{font-family:var(--sans);font-weight:300;font-size:15px;color:var(--ink);background:transparent;
    border:none;border-bottom:1px solid var(--hair);padding:9px 2px;transition:border-color .2s}
  .field input:focus{outline:none;border-bottom-color:var(--ink)}
  .field input::placeholder{color:var(--ink-3)}
  .pw{position:relative;display:flex;align-items:center}
  .pw input{width:100%;padding-right:64px}
  .pw-toggle{position:absolute;right:0;bottom:9px;background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px;transition:color .2s}
  .pw-toggle:hover{color:var(--ink)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 26px}
  .remember{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
  .remember input{width:15px;height:15px;accent-color:var(--ink)}
  .forgot{font-size:13.5px;color:var(--ink-2);background:none;border:none;cursor:pointer;text-decoration:none}
  .forgot:hover{color:var(--ink)}

  .btn{width:100%;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    cursor:pointer;padding:16px 22px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:#fff;transition:filter .2s,opacity .2s,box-shadow .2s,transform .12s}
  .btn:hover{filter:brightness(1.18);box-shadow:0 8px 22px rgba(28,26,22,.16);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:default}

  .msg{font-size:13.5px;line-height:1.5;margin:18px 0 0;min-height:1em}
  .msg.err{color:var(--red);background:#F7ECEA;border-radius:8px;padding:12px 14px}
  .msg.ok{color:var(--green)}
  .foot{border-top:1px solid var(--hair-soft);margin-top:34px;padding-top:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
</style>
</head>
<body>
  <aside class="mark">
    <div class="wm">ISYS MATTOS</div>
    <div class="tg">engenharia . arquitetura</div>
  </aside>

  <main class="panel">
    <div class="box">
      <p class="sec-label">acesso</p>
      <div class="roles" role="tablist" aria-label="Tipo de acesso">
        <button class="role" type="button" data-role="cliente" aria-selected="true">cliente</button>
        <span class="role-sep" aria-hidden="true">|</span>
        <button class="role" type="button" data-role="colaborador" aria-selected="false">colaborador</button>
        <span class="role-sep" aria-hidden="true">|</span>
        <button class="role" type="button" data-role="administrador" aria-selected="false">administrador</button>
      </div>
      <form id="form">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" placeholder="voce@email.com">
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <div class="pw">
            <input id="senha" type="password" autocomplete="current-password" placeholder="sua senha">
            <button type="button" class="pw-toggle" id="verSenha" aria-label="Mostrar senha">mostrar</button>
          </div>
        </div>
        <div class="row">
          <label class="remember"><input type="checkbox" id="remember" checked> Lembrar de mim</label>
          <button class="forgot" type="button" id="forgot">Esqueci minha senha</button>
        </div>
        <button class="btn" id="btn" type="submit">entrar</button>
        <p class="msg" id="msg"></p>
      </form>
      <p class="foot">Acesso restrito · ISYS MATTOS</p>
    </div>
  </main>

<script>
  /* Link de redefinição de senha que caiu nesta tela: leva para a tela de redefinir sem perder o token do e-mail. */
  if(/type=recovery/.test(location.hash+location.search)){ location.replace('redefinir.html'+location.search+location.hash); }
  var LINK_ERRO = /error(_code|_description)?=/.test(location.hash+location.search);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const $ = function(id){ return document.getElementById(id); };
  var msg = $('msg'), btn = $('btn');
  var roleSel = 'cliente';

  // toggle cliente | colaborador (dica visual; o destino final segue o papel real da conta)
  document.querySelectorAll('.role').forEach(function(r){
    r.addEventListener('click', function(){
      document.querySelectorAll('.role').forEach(function(x){ x.setAttribute('aria-selected','false'); });
      r.setAttribute('aria-selected','true'); roleSel = r.dataset.role;
    });
  });

  // Mostrar / ocultar senha
  $('verSenha').addEventListener('click', function(){
    var s = $('senha');
    if(s.type==='password'){ s.type='text'; this.textContent='ocultar'; } else { s.type='password'; this.textContent='mostrar'; }
  });

  // Link do e-mail vencido ou já usado: avisa e pede um novo.
  if(typeof LINK_ERRO!=='undefined' && LINK_ERRO){
    msg.className='msg err'; msg.textContent='Este link de redefinição expirou ou já foi usado. Digite seu e-mail acima e clique em "Esqueci minha senha" para receber um novo.';
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
  }

  // Se já estiver logado, vai direto para a área certa.
  (async function(){
    try{
      if(/type=recovery/.test(location.hash+location.search)) return; // está indo para a tela de redefinir
      var s = (await sb.auth.getSession()).data.session;
      if(s){ var perfil = await meuPerfil(); if(perfil){ location.href = destinoPorPapel(perfil.papel); } }
    }catch(e){}
  })();

  $('forgot').addEventListener('click', async function(){
    var em = $('email').value.trim();
    msg.className = 'msg';
    if(!em){ msg.className='msg err'; msg.textContent='Digite seu e-mail no campo acima e clique de novo em "Esqueci minha senha".'; return; }
    msg.textContent = 'Enviando link de redefinição…';
    try{
      // sempre o endereço oficial (https, sem "www"): é o que está liberado no Supabase
      var base = /^(localhost|127\.|\[::1\])/.test(location.hostname) ? location.origin : ('https://' + location.host.replace(/^www\./,''));
      var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: base + '/redefinir.html' });
      if(r.error){ msg.className='msg err'; msg.textContent='Não foi possível enviar: ' + r.error.message; return; }
      msg.className='msg ok'; msg.textContent='Enviamos um link de redefinição para ' + em + '. Confira seu e-mail (inclusive spam).';
    }catch(e){ msg.className='msg err'; msg.textContent='Erro: ' + (e && e.message || e); }
  });

  $('form').addEventListener('submit', async function(ev){
    ev.preventDefault();
    msg.className = 'msg'; msg.textContent = '';
    var em = $('email').value.trim(), sn = $('senha').value;
    if(!em || !sn){ msg.className='msg err'; msg.textContent='Preencha o e-mail e a senha.'; return; }
    btn.disabled = true; btn.textContent = 'entrando…';
    try{
      await entrar(em, sn);
      var perfil = await meuPerfil();
      if(!perfil){ msg.className='msg err'; msg.textContent='Login feito, mas seu acesso ainda não foi liberado pelo escritório.'; btn.disabled=false; btn.textContent='entrar'; return; }
      var esperado = roleSel==='administrador' ? 'admin' : roleSel;
      if(perfil.papel!==esperado){
        var nomePapel = perfil.papel==='admin'?'administrador':perfil.papel;
        msg.className='msg err'; msg.textContent='Esta conta é de '+nomePapel+'. Selecione a aba "'+nomePapel+'" para entrar.';
        try{ await sair(); }catch(e){}
        btn.disabled=false; btn.textContent='entrar'; return;
      }
      msg.className='msg ok'; msg.textContent='Tudo certo! Entrando…';
      location.href = destinoPorPapel(perfil.papel);
    }catch(err){
      msg.className='msg err';
      var t = (err && err.message) || '';
      msg.textContent = /invalid login/i.test(t) ? 'E-mail ou senha incorretos.' : ('Não foi possível entrar. ' + t);
      btn.disabled = false; btn.textContent = 'entrar';
    }
  });
</script>
<script>
  /* Alinha "engenharia . arquitetura" para ter exatamente a largura de "ISYS MATTOS"
     (ajusta só o espaçamento das letras do subtítulo; o título não muda). */
  (function(){
    /* Mede a largura VISÍVEL (da 1ª à última letra): desconta o espaçamento que sobra
       depois da última letra e a folga lateral dos glifos das pontas. */
    var cv=document.createElement('canvas'), ctx=cv.getContext('2d');
    function tw(el){ var r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }
    function folga(el, ch, lado){
      try{ var cs=getComputedStyle(el); ctx.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
        var m=ctx.measureText(ch); if(m.actualBoundingBoxLeft==null) return 0;
        return lado==='e' ? -m.actualBoundingBoxLeft : (m.width-m.actualBoundingBoxRight);
      }catch(e){ return 0; }
    }
    function fitMark(){
      var wm=document.querySelector('.mark .wm'), tg=document.querySelector('.mark .tg');
      if(!wm||!tg) return;
      var wt=(wm.textContent||'').trim(), tt=(tg.textContent||'').trim(); if(!wt||!tt) return;
      var vaos=tt.length-1; if(vaos<1) return;
      var wmLs=parseFloat(getComputedStyle(wm).letterSpacing)||0;
      var wmE=folga(wm,wt.charAt(0),'e'), wmD=folga(wm,wt.charAt(wt.length-1),'d');
      var tgE=folga(tg,tt.charAt(0),'e'), tgD=folga(tg,tt.charAt(tt.length-1),'d');
      var alvo=tw(wm)-wmLs-wmE-wmD;                 // largura visível de "ISYS MATTOS"
      tg.style.whiteSpace='nowrap'; tg.style.marginLeft='0px'; tg.style.letterSpacing='0px';
      var base=tw(tg)-tgE-tgD;                       // subtítulo sem espaçamento
      var ls=(alvo-base)/vaos; tg.style.letterSpacing=ls+'px';
      for(var i=0;i<3;i++){                          // correção fina
        var real=tw(tg)-ls-tgE-tgD; if(Math.abs(real-alvo)<0.02) break;
        ls+=(alvo-real)/vaos; tg.style.letterSpacing=ls+'px';
      }
      tg.style.marginLeft=(wmE-tgE)+'px';            // alinha também a borda esquerda
    }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitMark); } else { window.addEventListener('load',fitMark); }
    window.addEventListener('resize',fitMark);
  })();
</script>
</body>
</html>
