<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redefinir senha · Isys Mattos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
  :root{--paper:#FFFFFF;--ink:#414141;--ink-2:#717171;--ink-3:#a3a3a3;--hair:#D0D0D0;--hair-soft:#ECECEC;--red:#AA564A;--green:#5E7D57;
    --display:"Quicksand",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;color-scheme:light;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:37% 63%}
  @media(max-width:820px){body{grid-template-columns:1fr}}
  .mark{background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,5vw,64px)}
  @media(max-width:820px){.mark{min-height:180px;justify-content:flex-end}}
  .mark .wm{font-family:var(--sans);font-weight:400;font-size:clamp(28px,3.4vw,40px);letter-spacing:.14em}
  .mark .tg{font-size:13px;letter-spacing:.34em;color:#9a9895;margin-top:12px}
  .panel{display:flex;align-items:center;justify-content:center;padding:clamp(28px,5vw,72px)}
  .box{width:100%;max-width:392px}
  .sec-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .sec-label::before{content:"| ";color:var(--hair)}
  h2{font-family:var(--display);font-weight:500;font-size:clamp(22px,3vw,28px);margin:0 0 26px;color:var(--ink)}
  .field{display:flex;flex-direction:column;margin-bottom:22px}
  .field label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  .field input{font-family:var(--sans);font-weight:300;font-size:15px;color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--hair);padding:9px 2px}
  .field input:focus{outline:none;border-bottom-color:var(--ink)}
  .btn{width:100%;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:16px 22px;border:1px solid var(--ink);background:var(--ink);color:#fff;transition:filter .2s,opacity .2s;margin-top:6px}
  .btn:hover{filter:brightness(1.14)}.btn:disabled{opacity:.55;cursor:default}
  .msg{font-size:13.5px;line-height:1.5;margin:18px 0 0;min-height:1em}
  .msg.err{color:var(--red);background:#F7ECEA;border-radius:8px;padding:12px 14px}
  .msg.ok{color:var(--green)}
  .lk{display:inline-block;margin-top:16px;font-size:13.5px;color:var(--ink-2)}
</style>
</head>
<body>
  <aside class="mark"><div class="wm">ISYS MATTOS</div><div class="tg">engenharia . arquitetura</div></aside>
  <main class="panel">
    <div class="box">
      <p class="sec-label">acesso</p>
      <h2>Redefinir senha</h2>
      <div id="form-wrap">
        <div class="field"><label for="s1">Nova senha</label><input id="s1" type="password" placeholder="mínimo 6 caracteres"></div>
        <div class="field"><label for="s2">Repita a nova senha</label><input id="s2" type="password" placeholder="repita a senha"></div>
        <button class="btn" id="btn" type="button">salvar nova senha</button>
      </div>
      <p class="msg" id="msg"></p>
      <a class="lk" href="login.html">‹ voltar ao acesso</a>
    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  var $=function(id){return document.getElementById(id);};
  var msg=$('msg'), btn=$('btn'), temSessao=false;

  // O link do e-mail traz um token de recuperação; o supabase-js cria a sessão automaticamente.
  sb.auth.onAuthStateChange(function(event, session){ if(session) temSessao=true; });
  (async function(){
    try{ var s=(await sb.auth.getSession()).data.session; if(s) temSessao=true;
      if(!temSessao){ msg.className='msg err'; msg.textContent='Abra esta página pelo link que enviamos no e-mail de redefinição.'; }
    }catch(e){}
  })();

  btn.addEventListener('click', async function(){
    var a=$('s1').value, b=$('s2').value;
    msg.className='msg';
    if(a.length<6){ msg.className='msg err'; msg.textContent='A senha precisa de pelo menos 6 caracteres.'; return; }
    if(a!==b){ msg.className='msg err'; msg.textContent='As duas senhas não são iguais.'; return; }
    btn.disabled=true; btn.textContent='salvando…';
    try{
      var r=await sb.auth.updateUser({ password:a });
      if(r.error){ msg.className='msg err'; msg.textContent='Não foi possível redefinir: '+r.error.message+' (abra pelo link do e-mail).'; btn.disabled=false; btn.textContent='salvar nova senha'; return; }
      msg.className='msg ok'; msg.textContent='Senha redefinida! Redirecionando para o acesso…';
      $('form-wrap').style.display='none';
      setTimeout(function(){ location.href='login.html'; }, 1800);
    }catch(e){ msg.className='msg err'; msg.textContent='Erro: '+(e&&e.message||e); btn.disabled=false; btn.textContent='salvar nova senha'; }
  });

  /* Alinha o subtítulo à largura de "ISYS MATTOS" (só espaçamento das letras). */
  (function(){
    function tw(el){ var r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }
    function fitMark(){
      var wm=document.querySelector('.mark .wm'), tg=document.querySelector('.mark .tg');
      if(!wm||!tg) return;
      var target=tw(wm);
      tg.style.letterSpacing='0px';
      var n=tw(tg), chars=(tg.textContent||'').length||1;
      var ls=(target-n)/chars; tg.style.letterSpacing=ls+'px';
      var actual=tw(tg);
      if(Math.abs(actual-n)>0.5){ ls=ls*(target-n)/(actual-n); tg.style.letterSpacing=ls+'px'; }
    }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitMark); } else { window.addEventListener('load',fitMark); }
    window.addEventListener('resize',fitMark);
  })();
</script>
</body>
</html>
